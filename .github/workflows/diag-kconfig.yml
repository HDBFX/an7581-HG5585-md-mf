name: 诊断 kconfig（临时，用完即删）

# 复现 prepare-personal.sh 前半段（feeds + defconfig），dump istore 相关
# 元数据与 kconfig 符号，定位 luci-app-store 被静默丢弃的根因
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 复现 prepare 前半段（校验失败不阻塞）
        run: |
          bash extra/prepare-personal.sh xg-040g-md nokia_xg-040g-md-ubi an7581 || true

      - name: dump istore 诊断
        if: always()
        run: |
          cd ponwrt
          echo "========== 1. 最终 .config istore 相关 =========="
          grep -iE "istore|taskd|xterm" .config || echo "(.config 无匹配)"
          echo "========== 2. .config-package.in: istore 四包定义 =========="
          grep -n -A6 "config PACKAGE_luci-app-store$" tmp/.config-package.in || echo "(无 luci-app-store 符号)"
          grep -n -A6 "config PACKAGE_taskd$" tmp/.config-package.in || echo "(无 taskd 符号)"
          grep -n -A6 "config PACKAGE_luci-lib-taskd$" tmp/.config-package.in || echo "(无 luci-lib-taskd 符号)"
          grep -n -A6 "config PACKAGE_luci-lib-xterm$" tmp/.config-package.in || echo "(无 luci-lib-xterm 符号)"
          echo "========== 3. 元数据 .packageinfo: istore 四包 =========="
          grep -B4 -A14 "^Package: luci-app-store$" tmp/.packageinfo || echo "(无 luci-app-store 元数据)"
          grep -B4 -A12 "^Package: taskd$" tmp/.packageinfo || echo "(无 taskd 元数据)"
          echo "========== 4. 拷入的 iStore 目录结构 =========="
          find package/istore -name "Makefile" | head; echo "---"
          head -30 package/istore/luci-app-store/Makefile 2>/dev/null || echo "(Makefile 不存在)"
          echo "========== 5. 元数据生成阶段是否收录 istore =========="
          grep -c "istore" tmp/.packageinfo 2>/dev/null || echo "0"
          echo "========== 6. 实验：显式开 luci-app-store =========="
          {
            echo "CONFIG_TARGET_airoha=y"
            echo "CONFIG_TARGET_airoha_an7581=y"
            echo 'CONFIG_TARGET_BOARD="airoha"'
            echo 'CONFIG_TARGET_SUBTARGET="an7581"'
            echo 'CONFIG_TARGET_ROOTFS_SQUASHFS=y'
            echo 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y'
            echo 'CONFIG_PACKAGE_luci-app-store=y'
          } > .config
          make defconfig >/dev/null 2>&1
          grep -E "^# CONFIG_PACKAGE_luci-app-store|^CONFIG_PACKAGE_luci-app-store" .config || echo "(符号完全消失)"
          echo "========== 7. 实验：四包全开 =========="
          {
            echo "CONFIG_TARGET_airoha=y"
            echo "CONFIG_TARGET_airoha_an7581=y"
            echo 'CONFIG_TARGET_BOARD="airoha"'
            echo 'CONFIG_TARGET_SUBTARGET="an7581"'
            echo 'CONFIG_TARGET_ROOTFS_SQUASHFS=y'
            echo 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y'
            echo 'CONFIG_PACKAGE_luci-app-store=y'
            echo 'CONFIG_PACKAGE_luci-lib-taskd=y'
            echo 'CONFIG_PACKAGE_luci-lib-xterm=y'
            echo 'CONFIG_PACKAGE_taskd=y'
          } > .config
          make defconfig >/dev/null 2>&1
          grep -E "^# CONFIG_PACKAGE_(luci-app-store|luci-lib-taskd|luci-lib-xterm|taskd)|^CONFIG_PACKAGE_(luci-app-store|luci-lib-taskd|luci-lib-xterm|taskd)" .config
