name: 构建 md / mf 个人精简版固件

# 仅手动触发。个人特定版本：
#   - QModem 全功能（锁定 v3.2.0，用户要求 3.2 或以下）
#   - OpenClash 仅插件、不带内核（内核由用户在插件内自行下载）
#   - USB 4G/5G 驱动
#   - 不含任何主题（官方 bootstrap）、Passwall、EIP93/BBR/RPS/代理调优等
on:
  workflow_dispatch:

permissions:
  contents: write

# 独立并发组，与正式版/优化版互不排队、互不取消
concurrency:
  group: firmware-personal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: personal-${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # an7581: XG-040G-MD（UBI 版）
          - model: xg-040g-md
            profile: nokia_xg-040g-md-ubi
            subtarget: an7581
          # an7583: XG-040G-MF（UBI 版，与 MD 分属不同子目标）
          - model: xg-040g-mf
            profile: nokia_xg-040g-mf-ubi
            subtarget: an7583
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
      # 固件批次 P26（P=personal），产物名形如 arioha-xg-040g-md-R02-P26-11-15.itb，
      # 与正式版（B26）一眼区分
      FW_BATCH: "P26"
    steps:
      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib
                gettext git libncurses-dev libssl-dev python3 python3-dev
                python3-setuptools rsync swig unzip zlib1g-dev file wget curl
                libtool-bin libelf-dev device-tree-compiler ccache
                libglib2.0-dev libpixman-1-dev intltool quilt ecj fastjar"
          OPTS="-y --no-install-recommends -o Acquire::Retries=8 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120"
          sudo apt-get update -o Acquire::Retries=8 || true
          for i in 1 2 3 4; do
            if sudo apt-get install $OPTS $PKGS; then
              echo "依赖安装成功（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::第 $i 次安装依赖失败，切换镜像源后重试"
            sudo sed -i -E 's#https?://(azure\.)?archive\.ubuntu\.com#http://archive.ubuntu.com#g; s#https?://security\.ubuntu\.com#http://security.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 20
            sudo apt-get update -o Acquire::Retries=8 || true
          done
          echo "::error::依赖安装连续 4 次失败"
          exit 1

      - name: 恢复源码包缓存（dl）
        uses: actions/cache@v4
        with:
          path: cache/dl
          key: dl-v1
          restore-keys: |
            dl-

      - name: 恢复编译缓存（ccache，personal 独立前缀）
        uses: actions/cache@v4
        with:
          path: cache/ccache
          key: ccache-personal-${{ matrix.model }}-${{ hashFiles('extra/**') }}
          restore-keys: |
            ccache-personal-${{ matrix.model }}-

      - name: 限制 ccache 体积
        run: |
          export CCACHE_DIR="$PWD/cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G >/dev/null 2>&1 || true
          ccache -s 2>/dev/null | head -10 || true

      - name: 准备源码 / feeds / 定制 / 配置
        run: bash extra/prepare-personal.sh "${{ matrix.model }}" "${{ matrix.profile }}" "${{ matrix.subtarget }}"

      - name: 下载并编译
        run: bash extra/build-extra.sh "${{ matrix.model }}" "${{ matrix.profile }}" "${{ matrix.subtarget }}"

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: fw-personal-${{ matrix.model }}
          path: output/${{ matrix.model }}/
          if-no-files-found: error
          retention-days: 90

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-personal-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: 汇总发布到 Release
    needs: build
    # 只有两个机型都编译成功才发布，避免失败时生成空 Release
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 下载两个机型的固件
        uses: actions/download-artifact@v4
        with:
          pattern: fw-personal-*
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: find dist -type f -printf '%s  %p\n' | sort -k2

      - name: 创建 Release 并上传固件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fw-personal-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "个人版精简固件 $(date +%Y%m%d-%H%M)" \
            --notes "机型：xg-040g-md (airoha/an7581) / xg-040g-mf (airoha/an7583)；个人精简版：OpenClash（仅插件，内核自备）+ PassWall（内置 Xray 核心 + nftables 透明代理）+ PON 基础栈 + luci-app-airoha-npu（NPU 监控/CPU 频率控制/PLL 超频 500-1600MHz，中文界面，1400MHz 以上为超频档注意稳定性）+ Argon 主题（默认）+ 调优三件套（BBR/RPS 多核分发/代理调优/DNS 缓存）+ htop；已移除 QModem 全功能/USB 4G/5G 驱动/udpxy；修复 sysupgrade 升级后 LAN IP 被重置回出厂网关的 bug；固件批次 P26。" || true
